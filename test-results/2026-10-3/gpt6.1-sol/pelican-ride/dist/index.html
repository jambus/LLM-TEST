  <style>

    .page{max-width:1340px;margin:auto;padding:30px 54px 24px}.masthead{display:flex;align-items:center;justify-content:space-between;padding-bottom:26px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brand svg{width:37px;height:37px}.brand-name{font-size:15px;font-weight:750;letter-spacing:1.7px}.brand-sub{font-size:12px;margin-top:4px;letter-spacing:2px;color:var(--muted)}.edition{font-size:12px;letter-spacing:1.8px;color:var(--muted)}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:32px 0 24px}.eyebrow{font-size:12px;letter-spacing:2.2px;color:#788482;margin-bottom:12px}h1{font-size:clamp(28px,3.5vw,43px);margin:0;font-weight:650;letter-spacing:1.5px;line-height:1.35}h1 span{color:#e87b60}.intro p{font-size:15px;color:#75817e;margin:0 0 5px;line-height:1.8;letter-spacing:.4px}
    .stage{position:relative;overflow:hidden;border-radius:20px;border:1px solid #a9bcc3;background:#b9d5e6;isolation:isolate}.art{display:block;width:100%;height:auto}.scene-label{position:absolute;left:25px;top:24px;font-size:11px;letter-spacing:2.2px;color:#426b7d;display:flex;align-items:center;gap:10px}.scene-label:before{content:"";width:24px;height:1px;background:#426b7d}.scene-note{position:absolute;right:25px;top:24px;font-size:12px;color:#426b7d;display:flex;align-items:center;gap:8px}.scene-note svg{width:18px;height:18px}.scene-bottom{position:absolute;right:24px;bottom:19px;font-size:11px;letter-spacing:2px;color:#78877a}.play-badge{position:absolute;left:24px;bottom:17px;display:flex;gap:8px;align-items:center;font-size:12px;color:#5b7267}.play-badge i{display:block;width:6px;height:6px;border-radius:50%;background:#658b71}.paused .play-badge i{background:#9eaaa4}
    .controls{display:flex;justify-content:space-between;align-items:center;gap:28px;padding:22px 2px}.playback{display:flex;align-items:center;gap:17px}.play-button{border:0;border-radius:50%;background:var(--ink);color:#fff;width:49px;height:49px;display:grid;place-items:center}.play-button svg{width:18px;height:18px}.playback-title{font-size:14px;font-weight:650;margin-bottom:5px}.playback-hint{font-size:12px;color:var(--muted)}.speed{display:flex;align-items:center;gap:17px}.speed label{font-size:14px}.speed output{font-size:13px;font-variant-numeric:tabular-nums;width:39px;color:#586d65}.speed input{width:160px;height:24px;accent-color:#426959;cursor:pointer}.divider{height:31px;width:1px;background:var(--line);margin-right:4px}.tail{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;font-size:12px;color:#82908c;letter-spacing:.7px}.tail strong{color:#506660;font-weight:500}.key{font-size:11px;border:1px solid #d4dbd5;border-radius:4px;padding:2px 7px;margin-right:5px}
    @media(min-width:1500px){.page{padding-top:44px}.intro{padding-top:42px;padding-bottom:30px}}
    @media(max-width:700px){.page{padding:21px 20px}.masthead{padding-bottom:20px}.brand-name{font-size:12px;letter-spacing:1px}.brand-sub{font-size:10px;letter-spacing:1.4px}.edition{font-size:10px;letter-spacing:1px}.intro{display:block;padding:26px 0 22px}.intro p{margin:12px 0 0;font-size:14px}.eyebrow{font-size:11px;margin-bottom:9px}.stage{border-radius:15px}.art{width:155%;max-width:none;margin-left:-27.5%}.scene-label{top:16px;left:16px;font-size:9px;letter-spacing:1px}.scene-note{right:16px;top:16px;font-size:10px}.scene-note svg{width:14px}.scene-bottom{display:none}.play-badge{bottom:12px;left:16px;font-size:10px}.controls{gap:20px;align-items:flex-start;padding:22px 0;flex-wrap:wrap}.playback{gap:12px}.play-button{width:44px;height:44px}.speed{gap:10px;margin-top:7px}.speed label{font-size:12px}.speed input{width:100px}.divider{display:none}.tail{gap:12px;font-size:10px;line-height:1.8}.keyboard-hint{display:none}}

  </style>

        <g transform="translate(708 450)"><circle r="79" fill="#c6ddd1" fill-opacity=".16" stroke-width="9"/><circle r="73" fill="none" stroke="#f2eee0" stroke-width="3"/><g id="front-wheel"><use href="#spokes"/></g><circle r="6" fill="#dce9dc" stroke-width="3"/></g>
        <!-- Mint step-through bicycle. -->
        <path d="M410 450 500 343 550 450 410 450M500 343l160 13-110 94M650 322l58 128M660 356l-45-51" fill="none" stroke-width="12"/>

        <path d="M501 345l-7-32" stroke-width="7"/><path d="M470 312q23-7 52 0l-4 9h-44Z" fill="#955f49" stroke-width="3"/>
        <path d="m650 324-12-40 29-5q15-1 17 10" fill="none" stroke-width="7"/><path d="m667 279 13 3" stroke="#a87552" stroke-width="10"/>

        <path d="M415 450 548 433a17 17 0 0 1 0 34L415 455" fill="none" stroke="#789786" stroke-width="2"/>
        <circle cx="550" cy="450" r="20" fill="#d9e5d2" stroke-width="3"/><circle cx="550" cy="450" r="12" fill="none" stroke="#9cae9b" stroke-width="2"/>
        <g id="crank" transform="translate(550 450)"><path d="M-34 0h68" stroke-width="5"/><path d="M-45 0h22M23 0h22" stroke-width="6"/><circle r="4" fill="#30464c" stroke="none"/></g>
        <!-- Pelican: pear-shaped body, curved neck and a generous golden pouch. -->

          <path d="M577 223q13 22 8 39" fill="none" stroke="#d5d7c8" stroke-width="2"/>
          <path d="M640 137h150q-9 34-70 51-34 7-74-22Z" fill="url(#pouch)" stroke-width="3"/>

          <circle cx="638" cy="121" r="5" fill="#263543" stroke="none"/><circle cx="639.5" cy="119.5" r="1.4" fill="#fff" stroke="none"/>

<script>
  (() => {
    'use strict';
    const byId = id => document.getElementById(id);
    const nodes = Object.fromEntries(['stage','toggle','play-icon','play-label','status','speed','speed-value','back-wheel','front-wheel','crank','near-leg','far-leg','near-foot','far-foot','near-pedal','bird','scarf-tail','clouds','islands','waves','road','shadow','blink','wind-one','wind-two'].map(id => [id,byId(id)]));
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let playing = !reducedMotion.matches, speed = 1, elapsed = 0, previous = null, frame = null;
    const transform = (id, value) => nodes[id].setAttribute('transform', value);
    const mod = (n, m) => ((n % m) + m) % m;
    function draw(t) {
      const angle = t * 3.4, bob = Math.sin(angle * 2) * 2.1;
      const degrees = angle * 180 / Math.PI;
      transform('back-wheel', `rotate(${degrees * 1.55})`);
      transform('front-wheel', `rotate(${degrees * 1.55})`);
      transform('crank', `translate(550 450) rotate(${degrees})`);
      transform('bird', `translate(0 ${bob}) rotate(${Math.sin(angle)*.35} 539 315)`);
      const pedal = phase => ({x:550+Math.cos(phase)*34, y:450+Math.sin(phase)*34});
      // Two-link inverse kinematics keeps each foot attached to its moving pedal.
      function leg(id, footId, phase, hipX, hipY, bend) {
        const p=pedal(phase), dx=p.x-hipX, dy=p.y-hipY, d=Math.hypot(dx,dy), length=89;
        const h=Math.sqrt(Math.max(0,length*length-d*d/4));
        const kneeX=(hipX+p.x)/2-dy/d*h*bend, kneeY=(hipY+p.y)/2+dx/d*h*bend;
        nodes[id].setAttribute('d',`M${hipX} ${hipY} Q${hipX-2} ${hipY+10} ${kneeX} ${kneeY} L${p.x} ${p.y-7}`);
        nodes[footId].setAttribute('d',`M${p.x-9} ${p.y-5} Q${p.x+5} ${p.y-10} ${p.x+17} ${p.y-3}`);
        return p;
      }
      leg('far-leg','far-foot',angle+Math.PI,553,318+bob,.75);
      const near=leg('near-leg','near-foot',angle,539,318+bob,1);
      nodes['near-pedal'].setAttribute('d',`M${near.x-10} ${near.y+3}h27`);
      nodes['scarf-tail'].setAttribute('d',`M604 199Q551 ${189+Math.sin(t*5)*6} 513 ${204+Math.sin(t*5+1)*8}l14-18-18-11q49 ${-7+Math.cos(t*5)*5} 92 10`);
      transform('clouds',`translate(${-mod(t*5,1100)} 0)`);
      transform('islands',`translate(${-mod(t*11,1100)} 0)`);
      transform('waves',`translate(${-mod(t*19,1100)} 0)`);
      transform('road',`translate(${-mod(t*145,1100)} 0)`);
      nodes.shadow.setAttribute('rx',216+Math.sin(angle*2)*3);
      nodes.blink.setAttribute('opacity',mod(t,5.8)>5.64?'1':'0');
      nodes['wind-one'].setAttribute('opacity',.3+Math.sin(t*3)*.25);
      nodes['wind-two'].setAttribute('opacity',.3+Math.cos(t*3)*.25);
    }
    function tick(now) {
      if(!playing) return;
      if(previous!==null) elapsed+=Math.min((now-previous)/1000,.08)*speed;
      previous=now;draw(elapsed);frame=requestAnimationFrame(tick);
    }
    function renderState() {
      nodes.stage.classList.toggle('paused',!playing);
      nodes.toggle.setAttribute('aria-label',playing?'暂停动画':'播放动画');
      nodes.toggle.setAttribute('aria-pressed',String(!playing));
      nodes['play-icon'].innerHTML=playing?'<path d="M5 3h3v14H5zm7 0h3v14h-3z"/>':'<path d="m6 3 11 7-11 7z"/>';
      nodes['play-label'].textContent=playing?'骑行进行中':'歇一歇，看看海';
      nodes.status.textContent=playing?'正在兜风':'骑行已暂停';
    }
    function setPlaying(value) {
      playing=value;previous=null;cancelAnimationFrame(frame);renderState();
      if(playing) frame=requestAnimationFrame(tick);
    }
    nodes.toggle.addEventListener('click',()=>setPlaying(!playing));
    nodes.speed.addEventListener('input',event=>{
      speed=Number(event.target.value);nodes['speed-value'].value=`${speed.toFixed(1)}×`;
      nodes.speed.setAttribute('aria-valuetext',`${speed} 倍速`);
    });
    document.addEventListener('keydown',event=>{
      if(event.code==='Space'&&!event.repeat&&!/INPUT|BUTTON|TEXTAREA|SELECT/.test(event.target.tagName)){
        event.preventDefault();setPlaying(!playing);
      }
    });
    document.addEventListener('visibilitychange',()=>{
      previous=null;cancelAnimationFrame(frame);
      if(!document.hidden&&playing) frame=requestAnimationFrame(tick);
    });
    reducedMotion.addEventListener('change',event=>{if(event.matches)setPlaying(false);});
    draw(0);renderState();if(playing) frame=requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
